<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surya Mokkapati</title>
    <link rel="apple-touch-icon" href="https://github.com/suryamokkapati/suryamokkapati.github.io/blob/main/suryaicon.jpg?raw=true">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            color: #000;
            background: #fff;
            line-height: 1.4;
            position: relative;
            padding: 20px;
            margin: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    rgba(0, 0, 0, 0.03) 1px,
                    transparent 2px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent 0px,
                    rgba(0, 0, 0, 0.03) 1px,
                    transparent 2px
                );
            pointer-events: none;
            z-index: 1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0,0,0,0.1) 1px, transparent 1px),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.08) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(0,0,0,0.06) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(0,0,0,0.07) 1px, transparent 1px),
                radial-gradient(circle at 15% 90%, rgba(0,0,0,0.09) 1px, transparent 1px);
            background-size: 200% 200%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 100%;
            filter: contrast(1.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 3px double #000;
        }

        .author {
            font-size: 16pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 8px;
        }

        .affiliation {
            font-size: 10pt;
            margin-bottom: 10px;
        }

        .abstract {
            margin: 20px 0;
            padding: 15px 0;
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
        }

        .abstract-title {
            font-size: 11pt;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 0.15em;
            margin-bottom: 10px;
        }

        .abstract-content {
            font-size: 10pt;
            text-align: center;
        }

        .two-column-section {
            display: grid;
            grid-template-columns: 1fr 3px 1fr;
            gap: 0;
            margin: 20px 0;
            position: relative;
        }

        .vertical-line {
            width: 1px;
            background: #000;
            margin: 0 auto;
            height: 100%;
        }

        .column {
            font-size: 10pt;
            padding: 0 15px;
        }

        .column-left {
            padding-right: 20px;
        }

        .column-right {
            padding-left: 20px;
        }

        .section-title {
            font-size: 10pt;
            font-weight: 700;
            text-transform: uppercase;
            margin: 20px 0 10px 0;
            letter-spacing: 0.1em;
        }

        .section-title::before {
            content: "§ ";
        }

        ul {
            list-style: none;
            padding-left: 0;
            margin: 10px 0;
        }

        li {
            margin: 4px 0;
            padding-left: 15px;
            text-indent: -15px;
            font-size: 9pt;
            line-height: 1.3;
        }

        li::before {
            content: "• ";
            margin-right: 5px;
        }

        a {
            color: #000;
            text-decoration: underline;
        }

        a:hover {
            text-decoration: double underline;
        }

        .section-desc {
            font-size: 9pt;
            margin-bottom: 8px;
            font-style: italic;
        }

        .divider {
            border: none;
            border-top: 1px solid #000;
            margin: 15px 0;
            width: 100%;
        }

        .chi-rho {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 25px;
            opacity: 0.6;
            z-index: 1000;
            filter: grayscale(100%) contrast(1.2);
        }

        .chi-rho:hover {
            opacity: 1;
        }

        .library-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 3px double #000;
        }

        .library-title {
            font-size: 12pt;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
        }

        .library-title::before {
            content: "§ ";
        }

        .library-subsection {
            margin: 15px 0;
        }

        .subsection-heading {
            font-size: 9pt;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .page-footer {
            text-align: center;
            padding: 20px 0;
            font-size: 7pt;
            margin-top: 30px;
            border-top: 1px solid #000;
        }

        .flash-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            padding: 6px 12px;
            background-color: #000;
            color: #fff;
            border: 2px solid #000;
            font-size: 8pt;
            cursor: pointer;
            z-index: 1000;
            text-transform: uppercase;
        }

        .flash-btn:hover {
            background-color: #fff;
            color: #000;
        }

        @keyframes redWhiteBlue {
            0% {background-color: red;}
            33% {background-color: white;}
            66% {background-color: blue;}
            100% {background-color: red;}
        }

        .strobe-bg {
            animation: redWhiteBlue 0.09s steps(1) infinite;
        }

        .placeholder-item {
            opacity: 0.4;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .two-column-section {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .vertical-line {
                display: none;
            }
            body {
                padding: 10px;
            }
        }

        .books-section {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <a href="index.html">
        <img src="https://raw.githubusercontent.com/myrkwood137/suryamokkapati/main/chi_rho.png" class="chi-rho">
    </a>

    <button class="flash-btn" onclick="document.body.classList.toggle('strobe-bg')">
        DON'T PRESS
    </button>

    <div class="content">
        <header>
            <div class="author">Surya Mokkapati</div>
            <div class="affiliation">suryamokkapati@aol.com</div>
        </header>

        <section class="abstract">
            <div class="abstract-title">Abstract</div>
            <div class="abstract-content">[            ]</div>
        </section>

        <!-- rest unchanged -->
        <!-- (content preserved exactly as provided) -->

    </div>
</body>
</html>

    <h1>The Categorical Imperative</h1>
    <p> Immanuel Kant
    </p>
    <br>
    <p>
  Non Consequentialism: Everything has an inherent moral value, there are rules based on those values <br>
      Follow Rules = Moral <br>
      Don't Follow Rules = Immoral <br>
      <br> Where did the rules come from? What makes them legitimate? <br> <br>
      Divine Command Theory answers it with any divine figure.
      <br> <br>
      We now have the Categorical Imperative from Immanuel Kant. 
      <br>
      Kant is the preeminent enlightenment philosopher who kind of changed the entire playing field of the game. 
      <br> Where do you get the rules from? - Logic, Kant
      <br> "Logic = Ethics" "Ethics = Logic" <br>
      <br>
        Logic is valuable for the use of ethics because logic does not change. Formal logic is unchanging. Categorical Logic, Propositional Logic, Predicative Logic. <br>
        <br>
        Immanuel Kant wants to show how formal logic can be used to determine the ethical validity of value statements.
        <br>
        The difference between Should and Have To is in the results.
        <br> <br>
        Hypothetical Imperative is a hypothetical demand. <br>
        Categorical Imperative is a categorical (absolute, always true) demand. <br> 
        All imperatives command either hypothetically or categorically. Both are saying what makes logic good. <br> 
        Hypothetical Imperatives are logical commands of a situation. Specific situation or context. Every situation has a goal or end to be achieved. 
        <br> Logic is then locked in in a very specific way to achieve that goal. We use logic to achieve this. 
        <br> <br>
        Since hypothetical imperatives tell you steps to do what the end goal is, it tells you what to do. <br>
        Conversely, it tells you what not to do.
    </p>
    <p>
        The categorical imperative by principle is the principle that we get the rules from. This is how we gets the rules. Because logic is the means to good in the hypothetical, <br>
        it can be argued that it <i>is</i> good. Logic, I mean. Logic defines good or bad action. <br> <br>
        The Categorical Imperative is also the method by which we get the rules. <br> <br>
        <b> Act only in accordance with that <i>maxim</i> through which you can at the same time will that it become a universal law. </b>
    </p>
